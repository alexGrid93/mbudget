<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">
function App() {
  // Everything persisted to localStorage
  const [history,  setHistory]  = useLocalState('mila.history',   []);
  const [limit,    setLimit]    = useLocalState('mila.limit',     7100);
  const [balance,  setBalance]  = useLocalState('mila.balance',   7100);
  const [lastMonthKey, setLastMonthKey] = useLocalState('mila.monthKey', '');
  const [palette,  setPalette]  = useLocalState('mila.palette',   'blush');
  const [indicator, setIndicator] = useLocalState('mila.indicator', 'cake');
  const [soundOn,  setSoundOn]  = useLocalState('mila.soundOn',   true);

  // Re-check date every minute (catches midnight transition)
  const [now, setNow] = React.useState(() => new Date());
  React.useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 60000);
    return () => clearInterval(id);
  }, []);

  // Auto-refill at month rollover
  const monthKey = `${now.getFullYear()}-${now.getMonth()}`;
  React.useEffect(() => {
    if (lastMonthKey && lastMonthKey !== monthKey) {
      setBalance(limit);
      setHistory([]);
    }
    if (lastMonthKey !== monthKey) setLastMonthKey(monthKey);
  }, [monthKey]);

  React.useEffect(() => { soundCtx.enabled = soundOn; }, [soundOn]);

  const settings = {
    limit, balance, history,
    todayISO: now.toISOString().slice(0, 10),
    soundOn, indicator, palette,
  };

  const onSettingsChange = ({ balance: b, history: h, limit: l, palette: pa, indicator: ind, soundOn: s }) => {
    if (b !== undefined) setBalance(b);
    if (h !== undefined) setHistory(h);
    if (l !== undefined) {
      const spent = history.reduce((sum, it) => sum + (it.price || 0), 0);
      setLimit(l);
      setBalance(Math.max(0, l - spent));
    }
    if (pa !== undefined) setPalette(pa);
    if (ind !== undefined) setIndicator(ind);
    if (s !== undefined) setSoundOn(s);
  };

  return (
    <PhoneApp paletteKey={palette} settings={settings} onSettingsChange={onSettingsChange} />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
